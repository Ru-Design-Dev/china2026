<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>China 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Ma+Shan+Zheng&display=swap">
<style>
/* Layout: lacquer-box app — globe stage on the left, gold-framed travel ledger on the right; day rail across the top. Dark by design. */
:root{
  --ink:#0c0a0b; --lacquer:#170d10; --lacquer-2:#21131a; --line:#3a2329;
  --fg:#f3ebdf; --muted:#a8988c; --dim:#6f5f58;
  --red:#d8323f; --red-deep:#8e1622; --gold:#e6b450; --gold-soft:#b8913f;
  --jade:#4cc3a0; --sky:#7aa7ff;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-brush:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(1200px 700px at 30% 55%,rgba(216,50,63,.13),transparent 60%),radial-gradient(800px 500px at 90% 0%,rgba(230,180,80,.06),transparent 60%);}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}

.app{display:grid;grid-template-rows:auto auto 1fr;height:100%;gap:12px;padding-block:14px;max-width:1500px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:72px;width:auto;max-width:107px;flex:none;object-fit:contain;filter:drop-shadow(0 0 14px rgba(216,50,63,.45))}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:.02em;line-height:1;text-transform:uppercase;text-wrap:balance}
.brand h1 .amp{color:var(--gold)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.brand p .leaf{color:var(--red)}
.clocks{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.clock{border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--lacquer);min-width:128px}
.clock small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.clock b{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.clock .cn{font-family:var(--f-brush);color:var(--gold);font-weight:400;margin-left:6px}

/* day rail */
.rail{display:flex;align-items:stretch;gap:8px;min-width:0}
.rail .nav{flex:none;width:38px;border:1px solid var(--line);background:var(--lacquer);border-radius:8px;font-size:18px;color:var(--gold)}
.rail .nav:hover{border-color:var(--gold-soft)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:4px;scroll-snap-type:x proximity}
.day{flex:1 0 70px;scroll-snap-align:center;border:1px solid var(--line);background:var(--lacquer);border-radius:8px;padding:6px 6px 7px;text-align:left;position:relative;display:grid;gap:1px}
.day .wd{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.day .dn{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1}
.day .ct{font-family:var(--f-brush);font-size:15px;color:var(--gold-soft);line-height:1.1;white-space:nowrap}
.day .tick{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%}
.day .tick.flight{background:var(--gold)} .day .tick.train{background:var(--jade)} .day .tick.ground{background:var(--red)}
.day:hover{border-color:var(--gold-soft)}
.day.all{flex:0 0 64px}.day.all .dn{font-size:19px;padding-top:3px}
.day[aria-pressed="true"]{background:linear-gradient(180deg,var(--red),var(--red-deep));border-color:var(--red)}
.day[aria-pressed="true"] .wd{color:#ffd9cf} .day[aria-pressed="true"] .ct{color:#ffe7b0}
.day.today::after{content:"TODAY";position:absolute;bottom:-1px;right:6px;font-size:8px;letter-spacing:.12em;color:var(--gold)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;min-height:0}
.stage{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:340px;background:radial-gradient(circle at 50% 50%,#1b0f13 0%,var(--ink) 70%)}
#globe{position:absolute;inset:0}
.stage .legend{position:absolute;left:14px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);background:rgba(12,10,11,.7);padding:6px 10px;border-radius:6px;pointer-events:none}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.stage .whereami{position:absolute;left:14px;top:12px;max-width:calc(100% - 28px);pointer-events:none}
.whereami small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.whereami div{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.4vw,44px);line-height:1;text-transform:uppercase;text-shadow:0 2px 20px #000}
.whereami .cnbig{font-family:var(--f-brush);font-weight:400;color:var(--red);margin-left:10px;text-transform:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}

/* city marker */
/* marker = zero-size anchor sitting exactly on the coordinate; dot centred on it, label offset beside it */
.mk{position:relative;width:0;height:0;white-space:nowrap;font-size:11px;color:var(--fg);text-shadow:0 1px 6px #000}
.mk .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(230,180,80,.2);pointer-events:auto;cursor:pointer}
.mk .lab{position:absolute;left:10px;top:-11px;display:flex;align-items:baseline;gap:5px;background:rgba(12,10,11,.72);border:1px solid var(--line);padding:1px 7px;border-radius:5px;pointer-events:auto;cursor:pointer}
.mk .lab b{font-family:var(--f-brush);font-weight:400;font-size:15px;color:var(--gold)}
.mk.on .dot{background:var(--red);box-shadow:0 0 0 4px rgba(216,50,63,.35),0 0 18px var(--red)}
.mk.on .lab{border-color:var(--red)}
.mk.left .lab{left:auto;right:10px;top:-20px}
.mk.right .lab{top:-2px}

/* panel */
.panel{display:grid;grid-template-rows:auto 1fr;min-height:0;border:1px solid var(--gold-soft);border-radius:14px;background:var(--lacquer);
  box-shadow:inset 0 0 0 4px var(--lacquer),inset 0 0 0 5px rgba(230,180,80,.25);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:6px 6px 0;gap:2px}
.tabs button{flex:1;min-width:0;background:none;border:0;padding:10px 4px 9px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--red)}
.tabs button span{font-family:var(--f-brush);letter-spacing:0;margin-right:5px;color:var(--gold-soft);font-size:14px}
.pane{overflow-y:auto;padding:18px 18px 24px;min-height:0}
.pane h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.pane h3{margin:22px 0 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:8px}
.pane h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor;font-weight:600;white-space:nowrap}
.chip.ok{color:var(--jade)} .chip.todo{color:var(--gold)} .chip.plan{color:var(--muted)} .chip.warn{color:var(--red)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:62px 14px minmax(0,1fr);gap:10px;position:relative}
.tl .tm{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
.tl .tm small{display:block;font-size:10px;color:var(--dim);line-height:1.2;margin-top:2px}
.tl .rl{position:relative}
.tl .rl::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--line)}
.tl li:first-child .rl::before{top:8px} .tl li:last-child .rl::before{bottom:calc(100% - 8px)}
.tl .rl i{position:absolute;left:2px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--muted);border:2px solid var(--lacquer)}
.tl .flight i{background:var(--gold)} .tl .train i{background:var(--jade)} .tl .ground i{background:var(--red)} .tl .hotel i{background:var(--sky)} .tl .todo i{background:transparent;border:2px dashed var(--gold)}
.tl .bd{padding-bottom:16px;min-width:0}
.tl .bd b{font-weight:600}
.tl .bd p{margin:2px 0 0;color:var(--muted);font-size:13px}

.note{border-left:2px solid var(--gold);background:rgba(230,180,80,.06);padding:9px 12px;border-radius:0 8px 8px 0;font-size:13.5px;margin-top:10px}
.note.red{border-color:var(--red);background:rgba(216,50,63,.08)}
.sleep{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--lacquer-2)}
.sleep .zz{font-family:var(--f-brush);font-size:26px;color:var(--sky);line-height:1}
.sleep b{display:block}
.crew{display:flex;flex-wrap:wrap;gap:6px}
.crew span{font-size:12.5px;border:1px solid var(--line);padding:3px 9px;border-radius:99px;background:var(--lacquer-2)}
.crew span.new{border-color:var(--jade);color:var(--jade)}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plan li{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:14px}
.plan li::before{content:"·";color:var(--red);font-weight:700;font-size:20px;line-height:1}
.empty{color:var(--muted);font-size:13.5px;font-style:italic}

/* cards (travel/hotels) */
.cards{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--lacquer-2);display:grid;gap:6px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--gold-soft)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card .code{font-family:var(--f-mono);font-size:12px;color:var(--gold)}
.card .route{font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:uppercase;line-height:1.05}
.card .times{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card .times .big{font-size:20px} .card .times small{display:block;font-size:10.5px;color:var(--muted);font-family:var(--f-body)}
.card .times .mid{font-size:11px;color:var(--muted);text-align:center}
.card .times .mid::before{content:"";display:block;height:1px;background:var(--line);margin-bottom:3px}
.card .times .r{text-align:right}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
.card dt{color:var(--muted)} .card dd{margin:0;min-width:0}
.card .k{border-left:3px solid var(--gold)}
.card.k-train{border-left:3px solid var(--jade)} .card.k-flight{border-left:3px solid var(--gold)} .card.k-ground{border-left:3px solid var(--red)} .card.k-todo{border-left:3px dashed var(--gold)}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.total small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.total b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:500;color:var(--gold)}

.check{display:grid;gap:8px}
.check label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--lacquer-2);cursor:pointer}
.check input{accent-color:var(--red);margin-top:3px;width:16px;height:16px;flex:none}
.check label:has(input:checked) span{color:var(--muted);text-decoration:line-through}


.post{display:block;width:100%;height:auto;aspect-ratio:3/1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:#120a0d}
.post-wrap{position:relative}
.post-wrap .tagcn{position:absolute;right:10px;top:6px;font-family:var(--f-brush);font-size:26px;color:rgba(255,231,176,.85);text-shadow:0 2px 10px #000}
.fit{display:grid;gap:8px;margin-top:4px}
.gym{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.gym .chip{flex:none}
.chip.yes{color:var(--jade)} .chip.unclear{color:var(--gold)} .chip.no{color:var(--muted)}
.run{border:1px solid rgba(76,195,160,.45);background:rgba(76,195,160,.07);border-radius:9px;padding:10px 12px;display:grid;gap:4px}
.run .rh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.run .rh b{color:var(--jade);font-weight:600}
.run .km{font-family:var(--f-mono);font-size:13px;color:var(--jade);white-space:nowrap}
.run p{margin:0;font-size:13px;color:var(--fg)}
.run p.tip{color:var(--muted)}
.run a{font-size:12.5px;color:var(--jade)}
.sleep-card{border:1px solid var(--line);border-radius:10px;background:var(--lacquer-2);overflow:hidden}
.sleep-card .post{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.sleep-card .in{padding:12px;display:grid;gap:8px}
.fitsum{display:flex;gap:6px;flex-wrap:wrap}

.rmap{display:block;width:100%;height:auto;aspect-ratio:2/1;max-width:100%;background:#0f1514;border-radius:8px;border:1px solid rgba(76,195,160,.3)}
.runcard{border:1px solid var(--line);border-radius:12px;background:var(--lacquer-2);overflow:hidden}
.runcard .post{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.runcard .in{padding:12px 14px 14px;display:grid;gap:10px}
.runcard .ttl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.runcard .ttl b{font-family:var(--f-display);font-size:21px;text-transform:uppercase;font-weight:700;line-height:1.05}
.runcard .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:520px){.runcard .two{grid-template-columns:1fr}}
.linkbtn{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--jade)}
.linkbtn:hover{border-color:var(--jade)}
.daylist{display:grid;gap:6px}
.drow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--lacquer-2);border-radius:9px;padding:8px 10px;width:100%}
.drow:hover{border-color:var(--gold-soft)}
.drow .dd{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1}
.drow .dd small{display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:400}
.drow .tt{min-width:0}.drow .tt span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.facts div{border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center}
.facts b{display:block;font-family:var(--f-display);font-size:26px;color:var(--gold);line-height:1}
.facts small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-width:980px){
  html,body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .stage{height:56vh;min-height:320px}
  .pane{overflow:visible}
  .panel{overflow:visible}
  .clocks{margin-left:0;width:100%}
  .clock{flex:1}
}
@media (max-width:520px){
  .rail .nav{display:none}
  .day{flex:0 0 64px}
  .tl li{grid-template-columns:52px 14px minmax(0,1fr)}
  .pane{padding:16px 14px 22px}
}
.hint{display:none;margin:6px 0 0;font-size:11px;color:var(--muted);text-shadow:0 1px 8px #000}
/* phones: compact header, sticky day picker + tabs, globe that lets the page scroll */
@media (max-width:640px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
  .app{gap:10px;padding-block:10px 24px}
  .top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
  .logo{height:50px;max-width:74px}
  .brand h1{font-size:28px}
  .brand p{font-size:11.5px;line-height:1.4;margin-top:3px}
  .clocks{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
  .clock{min-width:0;padding:5px 8px}
  .clock small{font-size:9px;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clock b{font-size:14px}
  .clock .cn{display:none}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--ink);
    margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
    padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);
    box-shadow:0 8px 16px -10px rgba(0,0,0,.8)}
  .days{padding-bottom:0;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 58px;padding:5px 6px 6px}
  .day.all{flex:0 0 62px}
  .day .dn{font-size:21px}
  .day .ct{font-size:13px}
  .stage{height:50vh;min-height:300px;max-height:480px;border-radius:12px}
  .whereami div{font-size:28px}
  .stage .legend{left:8px;right:8px;bottom:8px;gap:4px 10px;font-size:10px;padding:5px 8px}
  .mk{font-size:10px}
  .mk .lab b{font-size:13px}
  .panel{border-radius:12px}
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--railH,68px));z-index:20;background:var(--lacquer);padding:4px 2px 0;border-radius:12px 12px 0 0}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 7px;font-size:10px;letter-spacing:.08em}
  .tabs button span{margin:0;font-size:16px;line-height:1.1}
  .pane{padding:14px 14px 22px}
  .pane h2{font-size:24px}
  .pane h3{margin-top:18px}
  .card{padding:11px 12px}
  .card .route{font-size:18px}
  .card .times .big{font-size:18px}
  .card dl{grid-template-columns:auto minmax(0,1fr);font-size:12.5px}
  .facts b{font-size:22px}
  .facts small{font-size:9px;letter-spacing:.08em}
  .totals b{font-size:17px}
  .sleep-card .in,.runcard .in{padding:11px 12px 12px}
  .runcard .ttl b{font-size:19px}
  .post-wrap .tagcn{font-size:22px}
}
@media (max-width:360px){
  .clock small{font-size:8.5px}
  .clock b{font-size:13px}
  .tabs button{font-size:9px;letter-spacing:.04em}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (pointer:coarse){.hint{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>

function routeSvg(pts){
  const lat0=pts.reduce((a,p)=>a+p[0],0)/pts.length,k=Math.cos(lat0*Math.PI/180);
  const xy=pts.map(([la,ln])=>[ln*k,-la]);const xs=xy.map(p=>p[0]),ys=xy.map(p=>p[1]);
  const W=300,H=150,pad=22,minx=Math.min(...xs),miny=Math.min(...ys),sx=Math.max(...xs)-minx||1e-6,sy=Math.max(...ys)-miny||1e-6;
  const s=Math.min((W-2*pad)/sx,(H-2*pad)/sy),ox=(W-sx*s)/2,oy=(H-sy*s)/2;
  const P=xy.map(([x,y])=>[(ox+(x-minx)*s).toFixed(1),(oy+(y-miny)*s).toFixed(1)]);
  const grid=[...Array(9)].map((_,i)=>`<line x1="${i*37.5}" y1="0" x2="${i*37.5}" y2="${H}" stroke="#1d2a27"/>`).join("")+[...Array(5)].map((_,i)=>`<line x1="0" y1="${i*37.5}" x2="${W}" y2="${i*37.5}" stroke="#1d2a27"/>`).join("");

DAYS.forEach((day,i)=>{
  const b=document.createElement("button");b.className="day";b.id="d-"+day.d;
  const x=parse(day.d);const kinds=day.legs.map(id=>LEGS.find(l=>l.id===id).kind);
  const tick=kinds.includes("flight")?"flight":kinds.includes("train")?"train":kinds.includes("ground")?"ground":"";
  const cn=day.city?C[day.city].cn:day.cn;
  b.innerHTML=`<span class="wd">${WD[x.getUTCDay()]}</span><span class="dn">${x.getUTCDate()}</span><span class="ct">${cn}</span>${tick?`<i class="tick ${tick}"></i>`:""}`;
  b.setAttribute("aria-label",fmt(day.d)+", "+day.title);
  if(day.d===torToday())b.classList.add("today");
  b.onclick=()=>select(i);
  daysEl.appendChild(b);
});
document.getElementById("prev").onclick=()=>select(Math.max(-1,cur-1));
document.getElementById("next").onclick=()=>select(Math.min(DAYS.length-1,cur+1));
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  if(e.key==="ArrowLeft")select(Math.max(-1,cur-1));
  if(e.key==="ArrowRight")select(Math.min(DAYS.length-1,cur+1));
});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderTabs();renderPane();panelToTop()});

/* ---------- panes ---------- */
function tmCell(e){return `<div class="tm">${esc(e.t||"")}${e.tz?`<small>${esc(e.tz)}</small>`:""}</div>`}
function paneDay(){
  if(cur<0)return paneAll();
  const day=DAYS[cur];const n=cur+1;
  const h=hotelFor(day.d);
  let s=`<div class="sub">Day ${n} of ${DAYS.length} · ${fmt(day.d)}, 2026</div><h2>${esc(day.title)}</h2>`;
  if(day.ev.length){
    s+=`<h3>Schedule · local time</h3><ol class="tl">`+day.ev.map(e=>`<li class="${e.k}">${tmCell(e)}<div class="rl"><i></i></div><div class="bd"><b>${esc(e.title)}</b>${e.p?`<p>${esc(e.p)}</p>`:""}</div></li>`).join("")+`</ol>`;
  }
  if(day.plan){s+=`<h3>${esc(day.planLabel)}</h3><ul class="plan">`+day.plan.map(p=>`<li>${esc(p)}</li>`).join("")+`</ul>`}
  if(!day.ev.length&&!day.plan){s+=`<h3>Schedule</h3><p class="empty">Open day in ${esc(C[day.city].name)}. Nothing planned yet.</p>`}
  (day.notes||[]).forEach(t=>s+=`<div class="note">${esc(t)}</div>`);
  s+=`<h3>Sleeping tonight</h3>`;
  if(h){
    const night=Math.round((parse(day.d)-parse(h.in))/864e5)+1;
    s+=`<div class="sleep-card"><div class="post-wrap">${art(h.id)}<span class="tagcn">${esc(C[h.city].cn)}</span></div><div class="in"><div><b>${esc(h.name)}</b><div class="sub">Night ${night} of ${h.nights} · ${esc(h.area)} · check out ${fmt(h.out)}</div><div class="sub">${h.rooms.map(r=>esc(r.r)+" ("+esc(r.who)+")").join("<br>")}</div><div class="sub"><a href="${esc(h.url)}" target="_blank" rel="noopener">Hotel photos and booking ↗</a></div></div>${gymLine(h,true)}</div></div>`;
  }else{
    s+=`<div class="sleep"><span class="zz">${day.d==="2026-11-11"?"飞":"家"}</span><div><b>${day.d==="2026-11-11"?"On the plane":"Home in Toronto"}</b><div class="sub">${day.d==="2026-11-11"?"Overnight on CX829, then straight on to Beijing.":"Trip complete."}</div></div></div>`;
  }
  s+=`<h3>Group</h3><div class="crew">`+day.crew.map(c=>`<span class="${c.startsWith("+")?"new":""}">${esc(c)}</span>`).join("")+`</div>`;
  return s;
}
function paneAll(){
  return `<div class="sub">Nov 11–23, 2026 · pick a day above for details</div><h2>The whole trip</h2>
  <h3>At a glance</h3><div class="facts"><div><b>13</b><small>Days</small></div><div><b>5</b><small>Cities</small></div><div><b>3</b><small>Flights</small></div><div><b>3</b><small>Trains</small></div></div>
  <h3>Day by day</h3><div class="daylist">${DAYS.map((d,i)=>{const h=hotelFor(d.d);const x=parse(d.d);return `<button class="drow" data-pick="${i}"><span class="dd">${x.getUTCDate()}<small>${WD[x.getUTCDay()].toUpperCase()}</small></span><span class="tt"><b>${esc(d.title)}</b><span>${h?esc(h.name):d.d==="2026-11-11"?"Overnight on CX829":"Home"}</span></span>${h?`<span class="chip ${h.gym[0]}">${GYM[h.gym[0]]}</span>`:""}</button>`}).join("")}</div>`;
}
function paneRuns(){
  if(cur<0){
    return `<div class="sub">All 5 stays · pick a date to see just that night</div><h2>Runs &amp; gyms</h2>
    <h3>Gyms</h3><div class="fitsum">${HOTELS.map(h=>`<span class="chip ${h.gym[0]}">${esc(C[h.city].name)} · ${GYM[h.gym[0]]}</span>`).join("")}</div>
    <h3>Every run</h3><div class="cards">${HOTELS.map(runCard).join("")}</div>
    <p class="sub" style="margin-top:14px">Distances are estimates. Google Maps needs a VPN or roaming data in mainland China.</p>`;
  }
  const d=DAYS[cur],h=hotelFor(d.d);
  let s=`<div class="sub">${fmt(d.d)} · ${esc(d.title)}</div><h2>${h?"Tonight's run &amp; gym":"No hotel tonight"}</h2>`;
  if(h){
    const morning=d.d===h.in?"You arrive today, so this is a good evening or tomorrow-morning run.":d.d===h.out?"":"";
    s+=`<h3>${esc(C[h.city].name)}</h3>${runCard(h)}${morning?`<div class="note">${morning}</div>`:""}`;
  }else{
    s+=`<p class="empty">${d.d==="2026-11-11"?"You're on CX829 overnight. Stretch your legs in the aisle and save the run for Beijing.":"Back in Toronto. Trip complete."}</p>`;
  }
  return s+`<h3>Other cities</h3><button class="linkbtn" data-pick="-1">Show runs and gyms for all 5 stays →</button>`;
}
function legCard(l){
  const st={ok:["ok","Confirmed"],todo:["todo","To book"],plan:["plan","Plan"]}[l.status];
  const kcls=l.status==="todo"?"k-todo":"k-"+l.kind;
  const hasT=l.dep.t!=="—";
  return `<button class="card ${kcls}" data-day="${l.day}">
    <div class="row"><span class="code">${esc(l.code)}</span><span class="chip ${st[0]}">${st[1]}</span></div>
    <div class="route">${esc(l.from)} → ${esc(l.to)}</div>
    ${hasT?`<div class="times"><div><span class="big">${l.dep.t}</span><small>${l.dep.d} · ${l.dep.tz}${l.dep.tor?"<br>"+l.dep.tor:""}</small></div><div class="mid">${esc(l.dur)}</div><div class="r"><span class="big">${l.arr.t}</span><small>${l.arr.d} · ${l.arr.tz}${l.arr.tor?"<br>"+l.arr.tor:""}</small></div></div>`:`<div class="sub">${esc(l.dep.d)} · ${esc(l.dur)}</div>`}
    <dl>${l.info.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
  </button>`;
}
function paneTravel(){
  return `<h2>Every leg</h2><div class="sub">Times are local to each airport or station. Tap a leg to jump to that day.</div><h3>Getting around</h3><div class="cards">${LEGS.map(legCard).join("")}</div>`;
}
function paneHotels(){
  const boys=HOTELS.reduce((a,h)=>a+h.rooms.filter(r=>r.who==="Group of 4").reduce((x,r)=>x+r.p,0),0);
  const vj=HOTELS.reduce((a,h)=>a+h.rooms.filter(r=>r.who!=="Group of 4").reduce((x,r)=>x+r.p,0),0);
  return `<h2>Where we sleep</h2><div class="sub">11 nights across 5 hotels. Prices as listed in the trip doc (CAD).</div>
  <h3>Totals</h3><div class="totals"><div class="total"><small>Group of 4</small><b>${money(boys)}</b><span class="sub">${money(boys/4)} each</span></div><div class="total"><small>The other 2</small><b>${money(vj)}</b><span class="sub">Chongqing + Shenzhen</span></div></div>
  <h3>Fitness at a glance</h3><div class="fitsum">${HOTELS.map(h=>`<span class="chip ${h.gym[0]}">${esc(C[h.city].name)} · ${GYM[h.gym[0]]}</span>`).join("")}</div>
  <h3>Hotels</h3><div class="cards">${HOTELS.map(h=>`<div class="card" role="button" tabindex="0" data-day="${h.in}"><div class="post-wrap">${art(h.id)}<span class="tagcn">${esc(C[h.city].cn)}</span></div>
    <div class="row"><span class="code">${esc(C[h.city].cn)} · ${esc(C[h.city].name)}</span><span class="chip ok">${h.nights} night${h.nights>1?"s":""}</span></div>
    <div class="route" style="font-size:19px">${esc(h.name)}</div>
    <dl><dt>Check in</dt><dd>${fmt(h.in)}</dd><dt>Check out</dt><dd>${fmt(h.out)}</dd>
    ${h.rooms.map(r=>`<dt>${esc(r.who)}</dt><dd>${esc(r.r)} · <span class="money">${money(r.p)}</span></dd>`).join("")}
    <dt>Area</dt><dd>${esc(h.area)}</dd><dt>Booked on</dt><dd>${esc(h.via)} · <a href="${esc(h.url)}" target="_blank" rel="noopener">Photos ↗</a></dd></dl>${gymLine(h,false)}</div>`).join("")}</div>
  <p class="sub" style="margin-top:14px">Run distances are estimates. Check the map link before heading out. Google Maps needs a VPN or roaming data in mainland China.</p>`;
}
const CHECK=[
 ["hsr","Book the Chongqing → Shenzhen HSR for Nov 20 (tickets open about 2 weeks ahead)"],
 ["pay","Get Alipay and WeChat Pay set up with a card linked (critical)"],
 ["vj","Get the Hong Kong → Chongqing flight details for the 2 joining"],
 ["pass","Passports on hand: train tickets are tied to the ID used to book"],
 ["pearson","Leave for Pearson on the evening of Tue Nov 10"],
];
function getChecks(){try{return JSON.parse(localStorage.getItem("md-checks")||"{}")}catch(e){return{}}}
function paneprep(){
  const c=getChecks();
  return `<h2>Before we go</h2><div class="sub">Ticks are saved in this browser only.</div>
  <h3>Checklist</h3><div class="check">${CHECK.map(([id,t])=>`<label for="ck-${id}"><input type="checkbox" id="ck-${id}" data-ck="${id}" ${c[id]?"checked":""}><span>${esc(t)}</span></label>`).join("")}</div>
  <h3>Heads up</h3>
  <div class="note red"><b>Flight home times don't match.</b> The trip doc says CX828 10:25 → 12:15. The confirmed itinerary and calendar invite say 11:00 → 12:30. Go with the confirmation, but worth a quick check with whoever booked.</div>
  <div class="note"><b>CX829 leaves just after midnight.</b> 00:35 on Wed Nov 11 means you're at the airport on Tuesday night.</div>
  <div class="note"><b>Calendar invites are in Toronto time.</b> China and Hong Kong are 13 hours ahead in November, so a 12:55 train shows as 11:55 PM the night before.</div>
  <div class="note"><b>Train days:</b> be at the station 60 minutes early with the passport used to book, and check the gate on the board.</div>`;
}
function panelToTop(){
  if(innerWidth>640)return;
  const rail=document.querySelector(".rail"),panel=document.querySelector(".panel");
  const off=rail.getBoundingClientRect().bottom+2,t=panel.getBoundingClientRect().top;
  if(t<off)window.scrollBy(0,t-off);
}
function renderTabs(){document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab))}
function renderPane(){
  const pane=document.getElementById("pane");
  pane.innerHTML={day:paneDay,travel:paneTravel,hotels:paneHotels,runs:paneRuns,prep:paneprep}[tab]();
  pane.querySelectorAll("[data-go-runs]").forEach(el=>el.onclick=e=>{e.stopPropagation();tab="runs";renderTabs();renderPane()});
  pane.querySelectorAll("[data-pick]").forEach(el=>el.onclick=()=>{const i=+el.dataset.pick;if(i>=0&&tab!=="runs"){tab="day";renderTabs()}select(i)});
  pane.querySelectorAll("[data-day]").forEach(el=>{
    const go=e=>{if(e.target.closest("a"))return;if(tab==="hotels"&&e.target.closest(".fit"))return;const i=DAYS.findIndex(d=>d.d===el.dataset.day);tab="day";renderTabs();select(i)};
    el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter")go(e)};
  });
  pane.querySelectorAll("[data-ck]").forEach(el=>el.onchange=()=>{const c=getChecks();c[el.dataset.ck]=el.checked;try{localStorage.setItem("md-checks",JSON.stringify(c))}catch(e){}});
  if(tab!=="day")pane.scrollTop=0;
}

/* ---------- select ---------- */
function select(i){
  cur=i;
  [...daysEl.children].forEach((b,j)=>b.setAttribute("aria-pressed",j===i+1));
  daysEl.children[i+1].scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  const day=i>=0?DAYS[i]:null;
  const where=!day?{name:"Whole trip",cn:"全程"}:day.city?C[day.city]:{name:day.label,cn:day.cn};
  document.getElementById("wa-lab").textContent=day?fmt(day.d)+" · where we are":"Nov 11–23 · 13 days, 5 cities";
  document.getElementById("wa-city").textContent=where.name;
  document.getElementById("wa-cn").textContent=where.cn;
  if(tab==="day"||tab==="runs"){renderPane();document.getElementById("pane").scrollTop=0;panelToTop()}
  try{history.replaceState(null,"",day?"#nov"+parse(day.d).getUTCDate():"#all")}catch(e){}
  updateGlobe();
}

/* ---------- globe ---------- */
const ARC={flight:"230,180,80",train:"76,195,160",ground:"216,50,63"};
function arcsFor(){
  const active=new Set(cur<0?LEGS.map(l=>l.id):DAYS[cur].legs);const out=[];
  LEGS.forEach(l=>{
    const segs=l.via?[[l.a,l.via],[l.via,l.b]]:[[l.a,l.b]];
    segs.forEach(([a,b])=>out.push({l,a,b,on:active.has(l.id)}));
  });
  return out;
}
function updateGlobe(){
  if(!G)return;
  const day=cur>=0?DAYS[cur]:null;
  zoomK=Math.max(0.18,Math.min(1,(day?day.view.altitude:1.75)/1.6));
  G.arcStroke(arcW).arcsData(arcsFor());
  const rings=[];
  if(day){if(day.city)rings.push(C[day.city]);day.legs.forEach(id=>{const l=LEGS.find(x=>x.id===id);rings.push({lat:l.a[0],lng:l.a[1]})})}
  else Object.values(C).forEach(c=>rings.push(c));
  G.ringsData(rings);
  document.querySelectorAll(".mk").forEach(m=>m.classList.toggle("on",day?m.dataset.c===day.city:true));
  G.pointOfView(day?day.view:{lat:31,lng:111,altitude:1.75},1600);
}
const TRIP=new Set(["China","Hong Kong","Macao"]);
let zoomK=1;
const arcW=d=>(d.on?(d.l.kind==="flight"?0.9:0.7):0.35)*zoomK;
function initGlobe(){
  const el=document.getElementById("globe");
  if(typeof Globe!=="function"){el.innerHTML='<div class="nogl">The 3D globe could not load here. Everything else on the page still works.</div>';return}
  try{
    G=Globe()(el)
      .backgroundColor("rgba(0,0,0,0)")
      .showAtmosphere(true).atmosphereColor("#d8323f").atmosphereAltitude(0.16)
      .polygonsData(WORLD)
      .polygonCapColor(f=>TRIP.has(f.properties.n)?"rgba(216,50,63,0.42)":f.properties.n==="Canada"?"rgba(216,50,63,0.26)":"rgba(230,180,80,0.07)")
      .polygonSideColor(()=>"rgba(0,0,0,0)")
      .polygonStrokeColor(f=>TRIP.has(f.properties.n)?"#ff8a80":f.properties.n==="Canada"?"rgba(255,138,128,.6)":"rgba(230,180,80,0.35)")
      .polygonAltitude(f=>TRIP.has(f.properties.n)?0.006:0.003)
      .arcStartLat(d=>d.a[0]).arcStartLng(d=>d.a[1]).arcEndLat(d=>d.b[0]).arcEndLng(d=>d.b[1])
      .arcColor(d=>{const c=ARC[d.l.kind];const o=d.on?1:0.28;return [`rgba(${c},${o})`,`rgba(${c},${o*0.85})`]})
      .arcStroke(arcW)
      .arcAltitude(d=>d.l.kind==="flight"?null:d.l.kind==="ground"?0.004:0.03)
      .arcAltitudeAutoScale(0.35)
      .arcDashLength(d=>d.l.dashed?0.06:d.on?0.45:1).arcDashGap(d=>d.l.dashed?0.04:d.on?0.12:0)
      .arcDashAnimateTime(d=>d.on?(d.l.kind==="flight"?3200:2200):0)
      .ringColor(()=>t=>`rgba(216,50,63,${1-t})`).ringMaxRadius(3).ringPropagationSpeed(2).ringRepeatPeriod(1100)
      .htmlElementsData(Object.entries(C).map(([k,v])=>({k,...v})))
      .htmlElement(d=>{
        const m=document.createElement("div");m.className="mk"+(d.pos?" "+d.pos:"");m.dataset.c=d.k;
        m.innerHTML=`<span class="dot"></span><span class="lab"><b>${d.cn}</b>${d.name}</span>`;
        m.onclick=()=>{const i=DAYS.findIndex(x=>x.city===d.k);if(i>=0)select(i)};
        return m;
      });
    const mat=G.globeMaterial();mat.color.set("#160b0e");if(mat.emissive)mat.emissive.set("#0d0507");if("shininess"in mat)mat.shininess=8;
    const ctl=G.controls();ctl.autoRotate=false;ctl.enableDamping=true;
    if(matchMedia("(pointer:coarse)").matches){
      /* one finger scrolls the page; two fingers rotate/zoom the globe */
      ctl.touches={ONE:null,TWO:3};
      const cv=G.renderer().domElement;cv.style.touchAction="pan-y";ctl.domElement&&(ctl.domElement.style.touchAction="pan-y");
    }
    const fit=()=>G.width(el.clientWidth).height(el.clientHeight);
    new ResizeObserver(fit).observe(el);fit();
  }catch(e){el.innerHTML='<div class="nogl">The 3D globe needs WebGL, which is off in this browser. Everything else on the page still works.</div>';G=null}
}

/* ---------- clocks ---------- */
function tick(){
  const f=tz=>new Intl.DateTimeFormat("en-CA",{timeZone:tz,weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
  document.getElementById("clk-to").textContent=f("America/Toronto");
  document.getElementById("clk-cn").textContent=f("Asia/Shanghai");
  const dep=Date.UTC(2026,10,11,5,35), ret=Date.UTC(2026,10,23,17,30), now=Date.now();
  const lab=document.getElementById("cd-lab"),cd=document.getElementById("cd");
  if(now<dep){const h=Math.floor((dep-now)/36e5);lab.textContent="Wheels up in";cd.textContent=Math.floor(h/24)+"d "+(h%24)+"h"}
  else if(now<ret){lab.textContent="Trip day";const t=torToday();const i=DAYS.findIndex(d=>d.d===t);cd.textContent=(i>=0?i+1:"—")+" of 13"}
  else{lab.textContent="Trip";cd.textContent="Done · 完"}
}

/* ---------- start ---------- */
initGlobe();
{const rail=document.querySelector(".rail");const setH=()=>document.documentElement.style.setProperty("--railH",rail.offsetHeight+"px");setH();window.addEventListener("resize",setH)}
let start=-1;
const hm=(location.hash||"").match(/^#nov(\d{1,2})$/);
if(hm){const i=DAYS.findIndex(d=>parse(d.d).getUTCDate()===+hm[1]);if(i>=0)start=i}
else if(location.hash!=="#all"){const t=torToday();const i=DAYS.findIndex(d=>d.d===t);if(i>=0)start=i}
renderTabs();select(start);
tick();setInterval(tick,30000);
</script>
